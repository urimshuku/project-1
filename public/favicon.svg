<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Full wordmark: stacked “studio” / “space.” in a white circle (matches brand lockup) -->
  <circle cx="32" cy="32" r="30" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  <g
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="600"
    fill="#111827"
    text-anchor="middle"
  >
    <text x="32" y="24" font-size="9.5">studio</text>
    <text x="32" y="38" font-size="9.5">space.</text>
  </g>
</svg>
